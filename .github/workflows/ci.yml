name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Pango (WeasyPrint, for campaign PDFs)
        run: sudo apt-get update && sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0

      - name: Install packages (shared first, then agents)
        run: |
          pip install --upgrade pip
          pip install -e ./shared -e './agents/pc[dev]' -e ./agents/campaign -e './agents/scribe[dev]'
          pip install ruff mypy

      - name: Lint (ruff)
        run: ruff check .

      - name: Type-check (mypy)
        run: mypy shared/src/ai_pc_shared agents/pc/src/ai_pc agents/campaign/src/ai_campaign agents/scribe/src/ai_scribe --ignore-missing-imports

      - name: Test (pytest)
        run: pytest

      - name: Build/import check
        run: python -c "import ai_pc_shared; import ai_pc; import ai_campaign.mcp_server; import ai_scribe.mcp_server"
