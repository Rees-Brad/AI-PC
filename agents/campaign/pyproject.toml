[project]
name = "ai-pc-agent-campaign"
version = "0.2.0"
description = "Campaign Agent tools for Claude Code: an MCP server for D&D campaign folders"
requires-python = ">=3.10"
dependencies = [
    "mcp>=2.3,<3",
    "pypdf>=5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
ai-campaign-mcp = "ai_campaign.mcp_server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
