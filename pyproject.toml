# Monorepo root - not an installable package itself. See shared/pyproject.toml
# and agents/pc/pyproject.toml for the installable packages, and
# CONTRIBUTING.md for dev setup. This file only holds shared tool config.

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "ISC"]

[tool.ruff.lint.isort]
known-first-party = ["ai_pc", "ai_pc_shared"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["shared/tests", "agents/pc/tests"]
asyncio_mode = "auto"
